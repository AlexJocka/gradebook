{% extends "base.html" %}
{% block title %}{{ s.full_name }}{% endblock %}
{% block content %}
<h1>{{ s.full_name }}</h1>
<section class="card">
  <form method="post" action="/students/{{ s.id }}" style="display:grid;gap:12px;max-width:420px">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Фамилия<input name="last_name" value="{{ s.last_name }}" required maxlength="100"></label>
    <label>Имя<input name="first_name" value="{{ s.first_name }}" required maxlength="100"></label>
    <label>Отчество<input name="middle_name" value="{{ s.middle_name or '' }}" maxlength="100"></label>
    <label>Год поступления<input name="admission_year" type="number" min="1990" max="2100" value="{{ s.admission_year }}" required></label>
    <label>Форма обучения
      <select name="study_form">{% for k, v in STUDY_FORMS.items() %}<option value="{{ k }}" {{ 'selected' if s.study_form == k }}>{{ v }}</option>{% endfor %}</select>
    </label>
    <label>Группа (перевод в другую группу)
      <select name="group_id">{% for g in groups %}<option value="{{ g.id }}" {{ 'selected' if s.group_id == g.id }}>{{ g.name }}</option>{% endfor %}</select>
    </label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg)">
      <input type="checkbox" name="is_active" {{ 'checked' if s.is_active }}> обучается (снимите отметку для отчисления)
    </label>
    <div><button class="primary">Сохранить</button> <a href="/students">отмена</a></div>
  </form>
</section>
{% endblock %}
